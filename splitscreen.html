<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>4 Screen Trading Mode</title>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .selector {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      background: #111;
      color: white;
      padding: 10px;
      z-index: 10;
    }

    .selector label {
      display: inline-block;
      margin: 5px 10px 5px 0;
    }

    .selector button {
      padding: 6px 10px;
      margin: 5px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    .selector button:hover {
      background: red;
    }

    .grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .pure .selector {
      display: none;
    }
  </style>
</head>

<body>

  <div class="selector">
    <strong>Select 4 Streams:</strong>
    <div id="checkboxes">Loading streams...</div>

    <button onclick="startSplit()">▶ Start 4 Screen</button>
    <button onclick="savePreset()">💾 Save</button>
    <button onclick="loadPreset()">⚡ Preset</button>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    let streams = [];

    const grid = document.getElementById("grid");
    const checkboxDiv = document.getElementById("checkboxes");

    // Load channel information from streams.json
    async function loadStreams() {
      try {
        const response = await fetch("./streams.json");

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        streams = await response.json();
        createCheckboxes();
        loadPreset();
      } catch (error) {
        checkboxDiv.textContent = "Could not load streams.json";
        console.error("JSON loading error:", error);
      }
    }

    function createCheckboxes() {
      checkboxDiv.innerHTML = "";

      streams.forEach((stream, index) => {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.value = index;

        label.appendChild(checkbox);
        label.append(` ${stream.name}`);

        checkboxDiv.appendChild(label);
      });
    }

    function startSplit() {
      const selected = [...document.querySelectorAll(
        '#checkboxes input[type="checkbox"]:checked'
      )]
        .map(checkbox => streams[Number(checkbox.value)])
        .slice(0, 4);

      if (selected.length !== 4) {
        alert("Select exactly 4 streams");
        return;
      }

      grid.innerHTML = "";

      selected.forEach(stream => {
        const iframe = document.createElement("iframe");

        iframe.src = `${stream.url}?autoplay=1&mute=1`;
        iframe.title = stream.name;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;

        grid.appendChild(iframe);
      });

      document.body.classList.add("pure");
    }

    function savePreset() {
      const selected = [...document.querySelectorAll(
        '#checkboxes input[type="checkbox"]:checked'
      )].map(checkbox => checkbox.value);

      localStorage.setItem("fav4", JSON.stringify(selected));
      alert("Saved!");
    }

    function loadPreset() {
      const saved = JSON.parse(
        localStorage.getItem("fav4") || "[]"
      );

      document.querySelectorAll(
        '#checkboxes input[type="checkbox"]'
      ).forEach(checkbox => {
        checkbox.checked = saved.includes(checkbox.value);
      });
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.body.classList.remove("pure");
      }
    });

    loadStreams();
  </script>

</body>
</html>
